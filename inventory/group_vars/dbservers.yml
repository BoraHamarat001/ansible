# Veri ve log dizin konumları
mysql_data_dir: "/oracle/mysql/data"
mysql_log_dir: "/oracle/mysql"
mysql_log_file: "/oracle/mysql/error.log"
mysql_config_file: "/etc/mysql/mysql.conf.d/mysqld.cnf"
